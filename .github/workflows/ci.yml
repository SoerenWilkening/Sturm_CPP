name: ci

# Lightweight push/PR checks. Currently runs the emit-target audit
# drift-check (Epic E1.M3, sturm-xq05.3): re-runs
# tools/audit_emit_targets.py and diffs against the committed
# docs/transpiler_emit_targets.tsv side-table. This catches matchers
# that start emitting new symbols (or moved defining headers) without
# the committed TSV + classification doc being updated.
#
# E2.M2 (sturm-nalq.2) adds the public-header lint step. E8.M1
# (sturm-8gvh.1) adds the public-API drift-check. E8.M2
# (sturm-8gvh.2) introduced the getting_started.md walkthrough
# extractor; sturm-b5t4 then dissolved the byte-equality drift-check
# between the doc and tests/external_consumer/main.cpp so the user-
# facing snippet and the internal smoke test can diverge intentionally
# (the extractor unit tests still run below). E6.M3 (sturm-795j.3)
# adds the sturmc-driver smoke variant alongside the M2
# add_quantum_executable variant, so both delivery paths from PRD §3.5
# are exercised against an installed prefix on every push/PR.
# Subsequent packaging-export milestones will add further drift checks
# as additional steps in this workflow.
#
# Per project rule: every cmake/ctest/make invocation is capped at 6
# threads (`--parallel 6` / `-j6`). The drift-check itself is a pure
# Python+shell pipeline and does not invoke cmake, but that cap still
# applies to any future build step added to this job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-checks:
    name: drift-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Emit-target audit drift-check (E1.M3)
        run: ./tools/check_emit_targets_drift.sh

      - name: Emit-target audit unit tests
        run: python3 -m unittest tests.tools.test_audit_emit_targets tests.tools.test_emit_targets_drift

      - name: Public-header lint (E2.M2)
        run: python3 tools/lint_public_headers.py

      - name: Public-header lint unit tests
        run: python3 -m unittest tests.tools.test_lint_public_headers

      - name: Public-API drift-check (E8.M1)
        run: ./tools/check_public_api_drift.sh

      - name: Public-API drift unit tests
        run: python3 -m unittest tests.tools.test_public_api_drift

      - name: Getting-started doc drift unit tests
        run: python3 -m unittest tests.tools.test_extract_md_code_blocks

  external-smoke:
    # E6.M2 (sturm-795j.2): drives `tests/external_consumer/` end-to-end
    # against an installed STURM prefix. The shell entry point lives at
    # `ci/run_external_smoke.sh`; it configures + builds STURM into a temp
    # tree, `cmake --install`s into a temp prefix, then hands off to
    # `tests/external_consumer/run_smoke.py` for the standalone consumer
    # configure/build/run/golden-diff. Every cmake step inside is hard-
    # capped at --parallel 6 per CLAUDE.md.
    name: external-consumer-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install LLVM-17 + CMake
        # The Clang plugin path of `add_quantum_executable` requires a
        # matching libclang/llvm; ubuntu-24.04 ships clang/llvm via apt.
        # cmake/python3 are already on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 llvm-17-dev libclang-17-dev cmake

      - name: Run external_consumer smoke (E6.M2)
        env:
          STURMC_CXX: clang++-17
        run: ./ci/run_external_smoke.sh

  sturmc-smoke:
    # E6.M3 (sturm-795j.3): drives the SAME `tests/external_consumer/`
    # source through the `sturmc` Python CLI rather than the
    # `add_quantum_executable` CMake helper that E6.M2 exercises. Same
    # golden output (tests/external_consumer/golden.txt), different
    # delivery path — proves both PRD §3.5 entry points stay green
    # against an installed STURM prefix. Hard-capped at --parallel 6
    # per CLAUDE.md.
    name: sturmc-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install LLVM-17 + CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 llvm-17-dev libclang-17-dev cmake

      - name: Run sturmc smoke (E6.M3)
        env:
          STURMC_CXX: clang++-17
        run: ./ci/run_sturmc_smoke.sh
