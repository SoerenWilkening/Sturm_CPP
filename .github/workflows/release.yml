name: release

# Tag-triggered 4-platform build producing relocatable prebuilt tarballs.
# Matches Phase L PL-2 spec (issue sturm-mzfa). PL-3 (sturm-bn4y) adds a
# 4-platform smoke-test matrix that gates the release-asset upload: if
# any platform's smoke-test fails, no assets for ANY platform reach the
# GitHub Release page. This is enforced by putting the asset upload in
# dedicated `publish-artifacts` / `publish-sha256sums` jobs that
# `needs: [build, smoke-test]`.
#
# Dependency note: this workflow copies LICENSE and README.md into the staging
# tree root. LICENSE exists (shipped in PL-1). README.md is scheduled to land
# in PL-5, which is expected to merge before any real v0.1.0 tag is pushed.
# As a belt-and-braces measure the copy step tolerates a missing README.md
# (via `|| true`) so that an early rc tag does not fail the entire matrix
# purely on a not-yet-created doc.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write  # needed by softprops/action-gh-release to create/update the release
  packages: write  # needed by docker-publish to push to ghcr.io

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-linux
            runner: ubuntu-24.04
            os: linux
          - triple: aarch64-linux
            runner: ubuntu-24.04-arm
            os: linux
          - triple: x86_64-macos
            # `macos-13` was retired in early 2026. `macos-15-intel` is the
            # current free-tier label for x86_64 macOS (see
            # github.com/actions/runner-images README).
            runner: macos-15-intel
            os: macos
          - triple: aarch64-macos
            runner: macos-14
            os: macos

    steps:
      - name: Checkout at tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "triple=${{ matrix.triple }}" >> "$GITHUB_OUTPUT"
          echo "stage_dir=sturm-transpile-${VERSION}-${{ matrix.triple }}" >> "$GITHUB_OUTPUT"
          echo "tarball=sturm-transpile-${VERSION}-${{ matrix.triple }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install LLVM 17 (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-17-dev \
            libclang-17-dev \
            clang-17 \
            cmake \
            patchelf

      - name: Install LLVM 17 (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install llvm@17 cmake

      - name: Configure (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${PWD}/staging/${{ steps.version.outputs.stage_dir }}" \
            -DLLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-17/lib/cmake/clang

      - name: Configure (macOS)
        if: matrix.os == 'macos'
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@17)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${PWD}/staging/${{ steps.version.outputs.stage_dir }}" \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DClang_DIR="${LLVM_PREFIX}/lib/cmake/clang"

      - name: Build
        # `-j` with no numeric arg means unlimited parallelism, which
        # forks more g++ invocations than a 2-core GitHub runner's 7GB
        # RAM can hold when every TU pulls in clang/Tooling/Tooling.h
        # (~1-2 GB RSS per process). `-j 2` matches the runner's core
        # count on every matrix entry (ubuntu-24.04 / ubuntu-24.04-arm
        # / macos-15-intel / macos-14 all provision 2-3 cores) and keeps the
        # peak RSS under the cap. Observed in the v0.1.0 workflow run:
        # both Linux builds were OOM-killed within 1m of entering this
        # step. Full fix discussion in sturm-pumi.
        run: cmake --build build -j 2

      - name: Install
        run: cmake --install build

      - name: Bundle LLVM shared libs (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          STAGE="staging/${{ steps.version.outputs.stage_dir }}"
          mkdir -p "${STAGE}/lib"
          LLVM_LIBDIR="$(dirname "$(readlink -f "$(which clang-17)")")/../lib"
          # libclang-cpp.so.17 and libLLVM-17.so are the runtime shared libs
          # sturm-transpile links against.
          cp -L "${LLVM_LIBDIR}/libclang-cpp.so.17" "${STAGE}/lib/"
          cp -L "${LLVM_LIBDIR}/libLLVM-17.so"      "${STAGE}/lib/"

      - name: Bundle LLVM shared libs (macOS)
        if: matrix.os == 'macos'
        run: |
          set -euxo pipefail
          STAGE="staging/${{ steps.version.outputs.stage_dir }}"
          mkdir -p "${STAGE}/lib"
          LLVM_PREFIX="$(brew --prefix llvm@17)"
          cp -L "${LLVM_PREFIX}/lib/libclang-cpp.dylib" "${STAGE}/lib/"
          cp -L "${LLVM_PREFIX}/lib/libLLVM.dylib"      "${STAGE}/lib/"

      - name: Patch RPATH (Linux)
        if: matrix.os == 'linux'
        run: |
          set -euxo pipefail
          STAGE="staging/${{ steps.version.outputs.stage_dir }}"
          patchelf --set-rpath '$ORIGIN/../lib' "${STAGE}/bin/sturm-transpile"
          # Sanity: libs should also find each other via the same relative path.
          for lib in "${STAGE}/lib/"*.so*; do
            patchelf --set-rpath '$ORIGIN' "${lib}" || true
          done

      - name: Patch RPATH (macOS)
        if: matrix.os == 'macos'
        run: |
          set -euxo pipefail
          STAGE="staging/${{ steps.version.outputs.stage_dir }}"
          BIN="${STAGE}/bin/sturm-transpile"
          install_name_tool -add_rpath '@loader_path/../lib' "${BIN}"
          # Rewrite absolute install names of each bundled dylib in the
          # binary's load commands to @rpath/<libname>.
          for lib in "${STAGE}/lib/"*.dylib; do
            libname="$(basename "${lib}")"
            # Detect the current (absolute, Homebrew-prefixed) install name
            # referenced by the binary and rewrite it to @rpath/<libname>.
            old_path="$(otool -L "${BIN}" | awk -v n="${libname}" '$1 ~ n {print $1; exit}')"
            if [ -n "${old_path}" ]; then
              install_name_tool -change "${old_path}" "@rpath/${libname}" "${BIN}"
            fi
            # Normalise the dylib's own install name too, so dependents of
            # dependents resolve via @rpath.
            install_name_tool -id "@rpath/${libname}" "${lib}"
          done
          # Re-sign after install_name_tool mutations (required on macOS 11+
          # including both x86_64 and aarch64 runners).
          codesign --force --sign - "${BIN}"
          for lib in "${STAGE}/lib/"*.dylib; do
            codesign --force --sign - "${lib}"
          done

      - name: Include LICENSE + README.md at staging root
        run: |
          set -euxo pipefail
          STAGE="staging/${{ steps.version.outputs.stage_dir }}"
          cp LICENSE "${STAGE}/LICENSE"
          # README.md is created in Phase L PL-5; tolerate absence on rc tags
          # pushed before PL-5 lands.
          cp README.md "${STAGE}/README.md" || true

      - name: Create tarball
        id: tarball
        run: |
          set -euxo pipefail
          tar czf "${{ steps.version.outputs.tarball }}" \
            -C staging "${{ steps.version.outputs.stage_dir }}"
          ls -la "${{ steps.version.outputs.tarball }}"

      - name: Compute SHA256
        shell: bash
        run: |
          set -euxo pipefail
          TARBALL="${{ steps.version.outputs.tarball }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          else
            # macOS runners ship `shasum`, not `sha256sum`.
            shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"
          fi
          cat "${TARBALL}.sha256"

      - name: Upload artifact (consumed by smoke-test + publish-artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sturm-transpile-${{ matrix.triple }}
          path: |
            ${{ steps.version.outputs.tarball }}
            ${{ steps.version.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────
  # Phase L PL-3 — 4-platform smoke-test matrix (sturm-bn4y).
  #
  # Regression guard that the prebuilt tarball from `build` actually runs
  # on a target platform with NO system LLVM installed — catches RPATH
  # misconfiguration, missing bundled dylibs, and cl::opt double-
  # registration regressions (the bug transpiler/CMakeLists.txt:84
  # already dodges, but which can resurface under different link orders).
  #
  # Fresh hosted runner: we deliberately do NOT `apt-get install llvm-17-*`
  # or `brew install llvm@17` in this job. Instead the first step ASSERTS
  # the absence of system LLVM-17 and fails loudly if the base image
  # ever starts shipping it, to keep the "relocatable tarball on a clean
  # VM" contract testable.
  # ───────────────────────────────────────────────────────────────────────
  smoke-test:
    name: smoke-test ${{ matrix.triple }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-linux
            runner: ubuntu-24.04
            os: linux
          - triple: aarch64-linux
            runner: ubuntu-24.04-arm
            os: linux
          - triple: x86_64-macos
            # `macos-13` was retired in early 2026. `macos-15-intel` is the
            # current free-tier label for x86_64 macOS (see
            # github.com/actions/runner-images README).
            runner: macos-15-intel
            os: macos
          - triple: aarch64-macos
            runner: macos-14
            os: macos

    steps:
      - name: Checkout (for fixture at tests/smoke/minimal_or.cpp)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Derive version + tarball name
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stage_dir=sturm-transpile-${VERSION}-${{ matrix.triple }}" >> "$GITHUB_OUTPUT"
          echo "tarball=sturm-transpile-${VERSION}-${{ matrix.triple }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Purge system LLVM-17 (Linux) to prove tarball self-containment
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -uxo pipefail
          # GitHub's ubuntu-24.04 image preinstalls clang-17/18/19, so the
          # old "assert clean" check always failed on current runners.
          # Instead, actively remove LLVM-17 from the runner so the
          # subsequent `bin/sturm-transpile` invocation is forced to
          # resolve against the bundled shared libs the build job
          # patched into `lib/` (DT_RUNPATH `$ORIGIN/../lib`). If
          # self-containment is broken, the binary will fail to load
          # libclang-cpp.so.17 / libLLVM-17.so at runtime and the
          # downstream "Run transpile" step will flag it.
          sudo apt-get remove -y \
            llvm-17 llvm-17-dev libclang-17-dev clang-17 libllvm17 \
            2>/dev/null || true
          # Also scrub /usr/bin/clang-17 if it survives the apt removal
          # (symlinks aren't always owned by a package).
          sudo rm -f /usr/bin/clang-17 /usr/bin/llvm-config-17 || true
          # Report residual state for log readability. clang-17 in PATH
          # at this point is a warning, not a failure — the tarball's
          # DT_RUNPATH resolves bundled libs first anyway.
          which clang-17 || echo "clang-17 not in PATH (expected)"
          dpkg -l 'llvm-17*' 'libclang-17*' 'clang-17*' 2>&1 | head -20 || true

      - name: Purge Homebrew llvm@17 (macOS) to prove tarball self-containment
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -uxo pipefail
          # Same rationale as the Linux variant: GitHub's hosted macOS
          # runners may preinstall or leave LLVM around from other tools.
          # Actively uninstall so bin/sturm-transpile has to resolve
          # against the bundled @rpath/libclang-cpp.dylib instead of a
          # system copy.
          brew uninstall --ignore-dependencies llvm@17 2>/dev/null || true
          brew list --versions llvm@17 >/dev/null 2>&1 && \
            echo "::warning::llvm@17 still present after uninstall" >&2 || \
            echo "llvm@17 not installed (expected)"

      - name: Download build artifact for this triple
        uses: actions/download-artifact@v4
        with:
          name: sturm-transpile-${{ matrix.triple }}
          path: artifact

      - name: Extract tarball
        shell: bash
        run: |
          set -euxo pipefail
          TARBALL="artifact/${{ steps.version.outputs.tarball }}"
          ls -la artifact/
          tar xzf "${TARBALL}"
          ls -la "${{ steps.version.outputs.stage_dir }}"

      - name: Assert `bin/sturm-transpile --help` exit 0 + non-empty stdout
        shell: bash
        run: |
          set -uxo pipefail
          STAGE="${{ steps.version.outputs.stage_dir }}"
          HELP_OUT="$("${STAGE}/bin/sturm-transpile" --help 2>/dev/null)"
          RC=$?
          if [ "${RC}" != "0" ]; then
            echo "::error::sturm-transpile --help exited with code ${RC} (expected 0)." >&2
            exit 1
          fi
          if [ -z "${HELP_OUT}" ]; then
            echo "::error::sturm-transpile --help produced empty stdout." >&2
            exit 1
          fi
          echo "--help OK (stdout is $(printf '%s' "${HELP_OUT}" | wc -c) bytes)."

      - name: Run transpile on tests/smoke/minimal_or.cpp
        id: transpile
        shell: bash
        run: |
          set -uxo pipefail
          STAGE="${{ steps.version.outputs.stage_dir }}"
          mkdir -p /tmp/out
          # Capture stderr to a file so we can grep it below for the
          # cl::opt double-registration regression signature AND still
          # show it in the job log.
          STDERR_LOG=/tmp/sturm-transpile.stderr
          set +e
          "${STAGE}/bin/sturm-transpile" tests/smoke/minimal_or.cpp \
            --output-dir /tmp/out \
            --extra-arg=-I"${PWD}/${STAGE}/include" \
            --extra-arg=-std=c++20 \
            2>"${STDERR_LOG}"
          RC=$?
          set -u
          # Surface stderr in the job log regardless of exit code so a
          # failing transpile run is easy to debug from the Actions UI.
          echo "----- sturm-transpile stderr -----" >&2
          cat "${STDERR_LOG}" >&2 || true
          echo "----- end stderr -----"             >&2
          echo "transpile_rc=${RC}" >> "$GITHUB_OUTPUT"
          echo "stderr_log=${STDERR_LOG}" >> "$GITHUB_OUTPUT"
          if [ "${RC}" != "0" ]; then
            echo "::error::sturm-transpile exited with code ${RC}." >&2
            exit 1
          fi

      - name: Verify output file exists and contains `uncompute_or(`
        shell: bash
        run: |
          set -uxo pipefail
          OUT=/tmp/out/minimal_or.cpp
          if [ ! -f "${OUT}" ]; then
            echo "::error::Expected transpiled output at ${OUT} but file does not exist." >&2
            ls -la /tmp/out/ >&2 || true
            exit 1
          fi
          if ! grep -q 'uncompute_or(' "${OUT}"; then
            echo "::error::Transpiled output ${OUT} does not contain \`uncompute_or(\` marker." >&2
            echo "::error::This indicates the M7 uncompute-injection matcher failed to fire." >&2
            echo "----- begin ${OUT} -----" >&2
            cat "${OUT}" >&2
            echo "----- end ${OUT} -----"   >&2
            exit 1
          fi
          echo "Output file present and contains \`uncompute_or(\` marker."

      - name: Grep stderr for cl::opt double-registration regression
        shell: bash
        run: |
          set -uxo pipefail
          STDERR_LOG="${{ steps.transpile.outputs.stderr_log }}"
          if [ -f "${STDERR_LOG}" ] && grep -q 'registered more than once' "${STDERR_LOG}"; then
            echo "::error::Detected \`registered more than once\` in sturm-transpile stderr." >&2
            echo "::error::This is the cl::opt double-registration regression — the workaround at transpiler/CMakeLists.txt:84 has likely broken under a new link order." >&2
            grep -n 'registered more than once' "${STDERR_LOG}" >&2
            exit 1
          fi
          echo "No cl::opt double-registration signature detected in stderr."

      - name: Optional — compile transpiled output with default system clang
        shell: bash
        continue-on-error: true
        run: |
          set -uxo pipefail
          # Deliberately use the default `clang++` from PATH, NOT the
          # bundled llvm-17 runtime. This proves the TRANSPILED output
          # has no runtime LLVM-version lock: once transpile is done the
          # generated .cpp is a plain C++20 source that any modern clang
          # should compile.
          STAGE="${{ steps.version.outputs.stage_dir }}"
          CLANG_BIN="$(command -v clang++ || true)"
          if [ -z "${CLANG_BIN}" ]; then
            echo "No default clang++ on PATH — skipping optional compile." >&2
            exit 0
          fi
          "${CLANG_BIN}" --version
          "${CLANG_BIN}" -std=c++20 -I"${PWD}/${STAGE}/include" \
            /tmp/out/minimal_or.cpp -c -o /tmp/minimal_or.o
          ls -la /tmp/minimal_or.o

  # ───────────────────────────────────────────────────────────────────────
  # Phase L PL-3 — publish-artifacts (option A restructure).
  #
  # Release-asset upload lives here (not in `build`) so it is gated on
  # `smoke-test` passing. If any of the 4 smoke-test matrix legs fails,
  # `needs: [build, smoke-test]` short-circuits the publish step and
  # NO tarballs reach the GitHub Release page.
  # ───────────────────────────────────────────────────────────────────────
  publish-artifacts:
    name: publish release tarballs
    needs: [build, smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into a single directory
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          # Each build job uploaded a directory named after its triple.
          # We only want the .tar.gz files here; the .sha256 sidecars are
          # consumed by the separate publish-sha256sums job below.
          for f in artifacts/*/*.tar.gz; do
            cp -v "${f}" release-assets/
          done
          ls -la release-assets/

      - name: Upload tarballs to GitHub Release (idempotent)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
          files: release-assets/*.tar.gz

  publish-sha256sums:
    name: publish SHA256SUMS
    needs: [build, smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate per-tarball sha256 files into SHA256SUMS
        run: |
          set -euxo pipefail
          : > SHA256SUMS
          # Each build job uploaded one artifact directory containing both
          # the tarball and its .sha256 sidecar. Concatenate all sidecars,
          # stripping any directory prefix that `sha256sum`/`shasum` emits,
          # into a single canonical SHA256SUMS file.
          for f in artifacts/*/*.sha256; do
            # sha256sum format: "<hash>  <path>" -- rewrite <path> to basename
            # so the file references just "sturm-transpile-<version>-<triple>.tar.gz".
            awk '{ sub(".*/", "", $2); print $1 "  " $2 }' "${f}" >> SHA256SUMS
          done
          sort -k2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to GitHub Release (idempotent)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: true
          files: SHA256SUMS

  # ───────────────────────────────────────────────────────────────────────
  # Phase L PL-7 (stretch) — docker-publish (sturm-k5hu).
  #
  # Build packaging/docker/Dockerfile and push to GHCR tagged both
  # `v${VERSION}` (= github.ref_name) and `latest`. Gated on `smoke-test`
  # like the tarball-publish jobs: if any platform's smoke-test fails, no
  # image reaches GHCR either.
  # ───────────────────────────────────────────────────────────────────────
  docker-publish:
    name: publish docker image to GHCR
    needs: [build, smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout at tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          # ubuntu-24.04 hosted runners expose 4 vCPU; override the
          # conservative default (2) baked into the Dockerfile.
          build-args: |
            BUILD_JOBS=4
          tags: |
            ghcr.io/soerenwilkening/sturm-transpile:${{ github.ref_name }}
            ghcr.io/soerenwilkening/sturm-transpile:latest
